<!doctype html>
<!-- Tailwind CSS v3 build output: utilities with --tw-*-opacity, rgb(R G B / var(--tw-bg-opacity)),
     alpha shorthands (/50), gradient stops through variables, ring/shadow variables, hover variants. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tailwind 3 dashboard</title>
<meta name="nd-test" content='{"expect":"dark"}'>
<style>
*,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;font-family:ui-sans-serif,system-ui,sans-serif}
body{margin:0;line-height:inherit}
h1,h2,h3,p{margin:0}
button{font:inherit;background-color:transparent;background-image:none;cursor:pointer}
input::placeholder{opacity:1;color:#9ca3af}
*,::before,::after{--tw-ring-inset: ;--tw-ring-offset-width:0px;--tw-ring-offset-color:#fff;--tw-ring-color:rgb(59 130 246 / 0.5);--tw-ring-offset-shadow:0 0 #0000;--tw-ring-shadow:0 0 #0000;--tw-shadow:0 0 #0000;--tw-shadow-colored:0 0 #0000}
.mx-auto{margin-left:auto;margin-right:auto}.mt-2{margin-top:.5rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}
.flex{display:flex}.grid{display:grid}.inline-flex{display:inline-flex}.hidden{display:none}
.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.gap-4{gap:1rem}.gap-2{gap:.5rem}
.items-center{align-items:center}.justify-between{justify-content:space-between}
.max-w-4xl{max-width:56rem}.min-h-screen{min-height:100vh}
.rounded-lg{border-radius:.5rem}.rounded-full{border-radius:9999px}.rounded-md{border-radius:.375rem}
.border{border-width:1px}.border-b{border-bottom-width:1px}
.border-gray-200{--tw-border-opacity:1;border-color:rgb(229 231 235 / var(--tw-border-opacity))}
.bg-white{--tw-bg-opacity:1;background-color:rgb(255 255 255 / var(--tw-bg-opacity))}
.bg-gray-50{--tw-bg-opacity:1;background-color:rgb(249 250 251 / var(--tw-bg-opacity))}
.bg-gray-100{--tw-bg-opacity:1;background-color:rgb(243 244 246 / var(--tw-bg-opacity))}
.bg-indigo-600{--tw-bg-opacity:1;background-color:rgb(79 70 229 / var(--tw-bg-opacity))}
.bg-green-100{--tw-bg-opacity:1;background-color:rgb(220 252 231 / var(--tw-bg-opacity))}
.bg-yellow-50{--tw-bg-opacity:1;background-color:rgb(254 252 232 / var(--tw-bg-opacity))}
.bg-black\/5{background-color:rgb(0 0 0 / 0.05)}
.bg-white\/90{background-color:rgb(255 255 255 / 0.9)}
.bg-gradient-to-r{background-image:linear-gradient(to right,var(--tw-gradient-stops))}
.from-indigo-50{--tw-gradient-from:#eef2ff var(--tw-gradient-from-position);--tw-gradient-to:rgb(238 242 255 / 0) var(--tw-gradient-to-position);--tw-gradient-stops:var(--tw-gradient-from),var(--tw-gradient-to)}
.to-white{--tw-gradient-to:#fff var(--tw-gradient-to-position)}
.p-4{padding:1rem}.p-6{padding:1.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}.py-1{padding-top:.25rem;padding-bottom:.25rem}.px-2{padding-left:.5rem;padding-right:.5rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}
.text-sm{font-size:.875rem;line-height:1.25rem}.text-xs{font-size:.75rem;line-height:1rem}.text-2xl{font-size:1.5rem;line-height:2rem}
.font-semibold{font-weight:600}.font-medium{font-weight:500}
.text-gray-900{--tw-text-opacity:1;color:rgb(17 24 39 / var(--tw-text-opacity))}
.text-gray-600{--tw-text-opacity:1;color:rgb(75 85 99 / var(--tw-text-opacity))}
.text-gray-500{--tw-text-opacity:1;color:rgb(107 114 128 / var(--tw-text-opacity))}
.text-white{--tw-text-opacity:1;color:rgb(255 255 255 / var(--tw-text-opacity))}
.text-indigo-600{--tw-text-opacity:1;color:rgb(79 70 229 / var(--tw-text-opacity))}
.text-green-800{--tw-text-opacity:1;color:rgb(22 101 52 / var(--tw-text-opacity))}
.text-yellow-800{--tw-text-opacity:1;color:rgb(133 77 14 / var(--tw-text-opacity))}
.text-gray-900\/70{color:rgb(17 24 39 / 0.7)}
.shadow{--tw-shadow:0 1px 3px 0 rgb(0 0 0 / 0.1),0 1px 2px -1px rgb(0 0 0 / 0.1);--tw-shadow-colored:0 1px 3px 0 var(--tw-shadow-color),0 1px 2px -1px var(--tw-shadow-color);box-shadow:var(--tw-ring-offset-shadow,0 0 #0000),var(--tw-ring-shadow,0 0 #0000),var(--tw-shadow)}
.ring-1{--tw-ring-offset-shadow:var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);--tw-ring-shadow:var(--tw-ring-inset) 0 0 0 calc(1px + var(--tw-ring-offset-width)) var(--tw-ring-color);box-shadow:var(--tw-ring-offset-shadow),var(--tw-ring-shadow),var(--tw-shadow,0 0 #0000)}
.ring-gray-900\/5{--tw-ring-color:rgb(17 24 39 / 0.05)}
.divide-y>:not([hidden])~:not([hidden]){--tw-divide-y-reverse:0;border-top-width:calc(1px * calc(1 - var(--tw-divide-y-reverse)));border-bottom-width:calc(1px * var(--tw-divide-y-reverse))}
.divide-gray-100>:not([hidden])~:not([hidden]){--tw-divide-opacity:1;border-color:rgb(243 244 246 / var(--tw-divide-opacity))}
.hover\:bg-indigo-500:hover{--tw-bg-opacity:1;background-color:rgb(99 102 241 / var(--tw-bg-opacity))}
.hover\:bg-gray-50:hover{--tw-bg-opacity:1;background-color:rgb(249 250 251 / var(--tw-bg-opacity))}
.focus\:ring-2:focus{--tw-ring-offset-shadow:var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);box-shadow:var(--tw-ring-offset-shadow),var(--tw-ring-shadow),var(--tw-shadow,0 0 #0000)}
@media (min-width:640px){.sm\:p-8{padding:2rem}}
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<nav class="bg-white/90 border-b border-gray-200 flex items-center justify-between px-3 py-2">
  <span class="font-semibold text-gray-900">Acme</span>
  <div class="flex gap-4 text-sm"><a class="text-gray-600" href="#">Dashboard</a><a class="text-indigo-600 font-medium" href="#">Team</a><a class="text-gray-600" href="#">Projects</a></div>

<main class="max-w-4xl mx-auto p-4 sm:p-8">
  <div class="rounded-lg bg-gradient-to-r from-indigo-50 to-white p-6 ring-1 ring-gray-900/5">
    <h1 class="text-2xl font-semibold text-gray-900">Welcome back, Tom</h1>
    <p class="mt-2 text-gray-500">Here is what happened with your projects this week.</p>
  </div>
  <div class="grid grid-cols-3 gap-4 mt-6">
    <div class="rounded-lg bg-white p-4 shadow"><p class="text-sm text-gray-500">Revenue</p><p class="text-2xl font-semibold text-gray-900">$45,231</p></div>
    <div class="rounded-lg bg-white p-4 shadow"><p class="text-sm text-gray-500">Subscriptions</p><p class="text-2xl font-semibold text-gray-900">+2,350</p></div>
    <div class="rounded-lg bg-white p-4 shadow"><p class="text-sm text-gray-500">Active now</p><p class="text-2xl font-semibold text-gray-900">573</p></div>
  </div>
  <ul class="mt-6 rounded-lg bg-white shadow divide-y divide-gray-100">
    <li class="flex justify-between p-4 hover:bg-gray-50"><span class="text-gray-900">Leslie Alexander</span><span class="rounded-full bg-green-100 px-2 text-xs font-medium text-green-800">Active</span></li>
    <li class="flex justify-between p-4"><span class="text-gray-900">Michael Foster</span><span class="rounded-full bg-yellow-50 px-2 text-xs font-medium text-yellow-800">Pending</span></li>
    <li class="flex justify-between p-4"><span class="text-gray-900/70">Dries Vincent</span><span class="rounded-full bg-black/5 px-2 text-xs text-gray-600">Offline</span></li>
  </ul>
  <div class="mt-6 rounded-lg border border-gray-200 bg-gray-100 p-4 text-sm text-gray-600">Inputs: <input class="rounded-md border border-gray-200 bg-white px-2 py-1 text-gray-900 focus:ring-2" placeholder="Search…"></div>
</main>
</body>
</html>
