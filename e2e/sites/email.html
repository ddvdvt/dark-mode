<!doctype html>

<tr><td align="center" style="padding:24px 0;">

      <table role="presentation" width="100%" cellspacing="0" cellpadding="8" border="0" style="margin-top:16px;border:1px solid #eeeeee;">
        <tr style="background-color:#fafafa;"><td style="color:#666666;font-size:14px;">Item</td><td style="color:#666666;font-size:14px;" align="right">Price</td></tr>

    </td></tr>
    <tr><td style="padding:16px 32px;font-family:Arial,sans-serif;font-size:12px;color:#999999;border-top:1px solid #eeeeee;">You received this email because you shopped at ShopCo. <a href="#" style="color:#999999;">Unsubscribe</a></td></tr>
  </table>
</td></tr>
