<!doctype html>
<!-- YouTube-like watch page on a light theme: a big black player in the middle of the viewport,
     a gradient control bar, chips, thumbnails (<img> and lazy CSS backgrounds switched by a class),
     duration badges over thumbnails. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch</title>
<meta name="nd-test" content='{"expect":"dark"}'>
<style>
  body { margin: 0; background: #fff; color: #0f0f0f; font: 14px Roboto, Arial, sans-serif; }
  .masthead { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: #fff; border-bottom: 1px solid #e5e5e5; }
  .search { flex: 1; max-width: 480px; border: 1px solid #ccc; border-radius: 40px; padding: 6px 16px; color: #606060; background: #fff; }
  .layout { display: flex; gap: 16px; padding: 0 16px; }
  .primary { flex: 1; }
  #player { position: relative; background: #000; height: 440px; }
  #player canvas { width: 100%; height: 100%; display: block; }
  .ytp-chrome-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(transparent, rgba(0,0,0,.8)); color: #fff; display: flex; align-items: end; padding: 8px 12px; box-sizing: border-box; }
  .ytp-time { color: #ddd; }
  h1 { font-size: 20px; margin: 12px 0 4px; }
  .owner { display: flex; align-items: center; gap: 12px; }
  .subscribe { background: #0f0f0f; color: #fff; border: 0; border-radius: 18px; padding: 8px 16px; font-weight: 500; }
  .like { background: rgba(0,0,0,.05); color: #0f0f0f; border: 0; border-radius: 18px; padding: 8px 16px; }
  .chips { display: flex; gap: 8px; margin: 8px 0; }
  .chips span { background: rgba(0,0,0,.05); color: #0f0f0f; border-radius: 8px; padding: 4px 12px; }
  .chips span.active { background: #0f0f0f; color: #fff; }
  .secondary { width: 360px; }
  .item { display: flex; gap: 8px; margin-bottom: 8px; }
  .thumb { position: relative; flex: none; width: 168px; height: 94px; border-radius: 8px; overflow: hidden; background: #e5e5e5 center / cover no-repeat; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.loaded { background-image: url(/img/lake.png); }
  .duration { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; padding: 1px 4px; border-radius: 4px; }
  .meta { color: #606060; font-size: 12px; }
</style>
</head>
<body>
<div class="masthead"><b>VideoHub</b><div class="search">Search</div></div>
<div class="layout">
  <div class="primary">
    <div id="player"><canvas id="frame" width="640" height="360"></canvas><div class="ytp-chrome-bottom"><span class="ytp-time">1:23 / 10:05</span></div></div>
    <h1>Ten days in the mountains</h1>
    <div class="owner"><b>Travel Channel</b><span class="meta">1.2M subscribers</span><button class="subscribe">Subscribe</button><button class="like">Like 12K</button></div>
    <div class="chips"><span class="active">All</span><span>From Travel Channel</span><span>Related</span></div>
  </div>
  <div class="secondary">
    <div class="item"><div class="thumb"><img src="/img/mountains.png" alt=""><span class="duration">12:01</span></div><div><b>Altai: day one</b><div class="meta">340K views</div></div></div>
    <div class="item"><div class="thumb lazy" id="lazy1"><span class="duration">8:44</span></div><div><b>Lake at dawn</b><div class="meta">90K views</div></div></div>
    <div class="item"><div class="thumb lazy" id="lazy2"><span class="duration">3:10</span></div><div><b>Short: the river</b><div class="meta">2M views</div></div></div>
    <div class="item"><div class="thumb"><img src="/photo.png" alt=""><span class="duration">25:00</span></div><div><b>Sunset timelapse</b><div class="meta">5K views</div></div></div>
  </div>
</div>
<script>
  const img = new Image();
  img.src = '/img/mountains.png';
  img.onload = () => document.getElementById('frame').getContext('2d').drawImage(img, 0, 0, 640, 360);
  // lazy thumbnails: a class switch sets the CSS background once the item is "visible"
  window.addEventListener('load', () => setTimeout(() => {
    for (const t of document.querySelectorAll('.thumb.lazy')) t.classList.replace('lazy', 'loaded');
    setTimeout(() => (window.__done = true), 50);
  }, 200));
</script>
</body>
</html>
