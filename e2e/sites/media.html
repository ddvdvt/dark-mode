<!doctype html>
<!-- Mixed media: text on photos (white text with shadow, a translucent white caption panel), emoji,
     colored SVG icons, brand-colored buttons (hue must survive), an SVG chart with a white plot
     background and dark labels, a canvas chart. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Media mix</title>
<meta name="nd-test" content='{"expect":"dark"}'>
<style>
  body { margin: 0; padding: 16px 24px; background: #fff; color: #222; font: 15px/1.5 system-ui, sans-serif; }
  .row { display: flex; gap: 16px; align-items: flex-start; margin: 12px 0; }
  .photo-card { position: relative; width: 300px; height: 170px; border-radius: 10px; background: url(/img/mountains.png) center / cover; overflow: hidden; }
  .photo-card h3 { position: absolute; left: 12px; top: 8px; margin: 0; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .photo-card .caption { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.85); color: #111; padding: 6px 12px; font-size: 13px; }
  .btn { border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; color: #fff; }
  .tg { background: #2aabee; } .vk { background: #0077ff; } .yt { background: #ff0000; } .kaspi { background: #f14635; }
  .yellow { background: #ffdd2d; color: #000; } .green { background: #21a038; }
  .icons svg { margin-right: 6px; }
  .emoji { font-size: 22px; }
  figure { margin: 0; }
</style>
</head>
<body>
<div class="row">
  <div class="photo-card" data-nd-onimage><h3>Text on a photo</h3><div class="caption">A caption on a translucent white panel</div></div>
  <div><p class="emoji">😀 🎉 🌲 🇰🇿 ❤️</p>
    <p class="icons"><svg width="24" height="24" data-nd-hue viewBox="0 0 24 24"><path fill="#e34c26" d="M3 2h18l-2 18-7 2-7-2z"/></svg><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffcc00"/><circle cx="12" cy="12" r="4" fill="#333"/></svg><svg width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="#222" stroke-width="2" d="M4 12h16M12 4v16"/></svg><svg width="24" height="24" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" fill="#25d366"/></svg></p></div>
</div>
<p><button class="btn tg" data-nd-hue>Telegram</button> <button class="btn vk" data-nd-hue>VK</button> <button class="btn yt" data-nd-hue>YouTube</button> <button class="btn kaspi" data-nd-hue>Kaspi</button> <button class="btn yellow" data-nd-hue>Pay</button> <button class="btn green" data-nd-hue>Sber</button></p>
<div class="row">
  <figure><svg width="320" height="180" viewBox="0 0 320 180" font-family="sans-serif">
    <rect width="320" height="180" fill="#ffffff"/>
    <g stroke="#e0e0e0"><path d="M40 20H310M40 60H310M40 100H310M40 140H310"/></g>
    <rect x="60" y="80" width="40" height="60" fill="#4e79a7"/><rect x="130" y="40" width="40" height="100" fill="#f28e2b"/><rect x="200" y="100" width="40" height="40" fill="#59a14f"/>
    <g fill="#333333" font-size="12"><text x="62" y="158">2023</text><text x="132" y="158">2024</text><text x="202" y="158">2025</text><text x="8" y="24">100</text><text x="14" y="144">0</text></g>
    <text x="110" y="14" font-size="13" font-weight="bold" fill="#111">Sales by year</text>
  </svg></figure>
  <figure><canvas id="chart" width="260" height="160"></canvas></figure>
</div>
<script>
  const c = document.getElementById('chart').getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, 260, 160);
  c.strokeStyle = '#e15759'; c.lineWidth = 3; c.beginPath();
  [10, 60, 40, 90, 70, 120].forEach((v, i) => (i ? c.lineTo(20 + i * 44, 150 - v) : c.moveTo(20, 150 - v)));
  c.stroke(); c.fillStyle = '#333'; c.font = '12px sans-serif'; c.fillText('Visitors', 10, 14);
</script>
</body>
</html>
