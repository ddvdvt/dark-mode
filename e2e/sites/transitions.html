<!doctype html>
<!-- Colors with CSS transitions (`transition: all`, background-color, color). Applying the theme or
     the "already dark?" re-checks must not start any color transition (that is a visible flicker). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transitions</title>
<meta name="nd-test" content='{"expect":"dark"}'>
<style>
  body { margin: 0; padding: 20px; background: #fff; color: #222; font: 16px sans-serif; transition: background-color .8s, color .8s; }
  .card { background: #f4f6f8; border: 1px solid #dfe3e8; padding: 14px; margin: 10px 0; border-radius: 8px; transition: all .6s ease; }
  .btn { background: #0d6efd; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; transition: background-color .5s, box-shadow .5s; }
  a { color: #0645ad; transition: color 1s; }
  .inline-t { transition: background-color 1s; }
</style>
<script>
  // record every CSS transition that starts on the page (theme changes must not animate)
  window.__transitions = [];
  addEventListener('transitionrun', (e) => window.__transitions.push((e.target.className || e.target.tagName) + ':' + e.propertyName + '@' + Math.round(performance.now())), true);
</script>
</head>
<body>
<h1>Smooth UI</h1>
<div class="card">Card with <code>transition: all .6s</code> and a <a href="#">link</a>.</div>
<div class="card"><button class="btn">Button</button></div>
<div class="inline-t" style="background:#fffbe6;color:#444;padding:10px">Inline colors with a transition</div>
<script>
  window.__ndCheck = () => window.__transitions.map((t) => 'transition started: ' + t);
</script>
</body>
</html>
